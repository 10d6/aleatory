<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aleatory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..700&display=swap" rel="stylesheet">
<style>
/* synthkit shell. A light instrument enclosure (graphite in dark mode);
   each synth sets --accent in ui/layout.json \002192 theme.accent. */
:root {
  --accent-base: #2457d6;
  --accent: var(--accent-base);
  --bg: #dcdfd9;
  --panel: #e9ebe6;
  --edge: #c4c9c1;
  --ink: #1f2a2e;
  --ink-soft: #5a6561;
  --cap: #2b3134;
  --cap-hi: #434b50;
  --track: #c2c7bf;
  --key: #f7f8f4;
  --key-edge: #b9beb6;
  --key-black: #262b2e;
  --field: #f5f6f2;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.7) inset, 0 1px 2px rgba(31, 42, 46, 0.12);
  --warn: #9a5b00;
  --error: #b3261e;
  --radius: 10px;
  --font: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --accent: color-mix(in oklab, var(--accent-base) 68%, white);
    --bg: #1d2123;
    --panel: #262b2e;
    --edge: #343b3f;
    --ink: #e3e7e1;
    --ink-soft: #98a19d;
    --cap: #111518;
    --cap-hi: #30373c;
    --track: #3a4247;
    --key: #d9ddd6;
    --key-edge: #8d948f;
    --key-black: #121517;
    --field: #1f2427;
    --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 1px 2px rgba(0, 0, 0, 0.35);
    --warn: #f0b860;
    --error: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --accent: color-mix(in oklab, var(--accent-base) 68%, white);
  --bg: #1d2123;
  --panel: #262b2e;
  --edge: #343b3f;
  --ink: #e3e7e1;
  --ink-soft: #98a19d;
  --cap: #111518;
  --cap-hi: #30373c;
  --track: #3a4247;
  --key: #d9ddd6;
  --key-edge: #8d948f;
  --key-black: #121517;
  --field: #1f2427;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.04) inset, 0 1px 2px rgba(0, 0, 0, 0.35);
  --warn: #f0b860;
  --error: #ff8a80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 13px/1.35 var(--font);
  font-variation-settings: "wdth" 90;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: flex; flex-direction: column; min-height: 100vh; }

/* ---- header ---------------------------------------------------------- */
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px;
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--edge);
}
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: 6px; }
.synth-name {
  margin: 0; font-size: 26px; line-height: 1; font-weight: 700;
  font-variation-settings: "wdth" 75; letter-spacing: -0.01em;
}
.synth-meta { color: var(--ink-soft); font-size: 12px; }

.btn {
  border: 1px solid var(--edge); background: var(--panel); border-radius: 7px;
  padding: 5px 11px; cursor: pointer; box-shadow: var(--shadow); white-space: nowrap;
}
.btn:hover { border-color: var(--ink-soft); }
.btn:disabled { opacity: 0.55; cursor: default; }
.btn-quiet { background: transparent; box-shadow: none; }
.btn-icon { padding: 5px 9px; min-width: 32px; }

.presets { display: flex; align-items: center; gap: 6px; }
.preset-field { position: relative; display: flex; align-items: center; }
.preset-select, .preset-name, .sig-select, .midi-select, .menu-select, .bpm-input {
  background: var(--field); border: 1px solid var(--edge); border-radius: 7px; padding: 5px 8px;
}
.preset-select, .preset-name { width: 13.5rem; font-weight: 600; }
.preset-dirty {
  position: absolute; right: -4px; top: -4px; width: 9px; height: 9px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--bg);
}

.tempo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tempo-readout { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-size: 13px; white-space: nowrap; }
.play-btn { min-width: 58px; }
.play-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.bpm { display: flex; align-items: center; gap: 5px; color: var(--ink-soft); }
.bpm-input { width: 4.2rem; font-variant-numeric: tabular-nums; color: var(--ink); }
.beats { display: flex; gap: 4px; }
.beat { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.beat.is-down { width: 9px; height: 9px; margin-top: -1px; }
.beat.is-on { background: var(--accent); }

.midi { display: flex; align-items: center; gap: 6px; }
.midi-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--track); }
.midi-dot.is-flash { animation: flash 0.25s ease-out; }
@keyframes flash { from { background: var(--accent); } }
.midi-select { max-width: 12rem; }

.output { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.scope {
  width: 160px; height: 40px; color: var(--accent);
  background: var(--field); border: 1px solid var(--edge); border-radius: 7px;
}
.output-side { display: flex; flex-direction: column; gap: 5px; width: 74px; }
.level { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.level-fill { height: 100%; width: 0; background: var(--ink-soft); transition: width 60ms linear; }
.level.is-hot .level-fill { background: var(--error); }
.voice-count { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.top-actions { display: flex; gap: 4px; }
.theme-btn { display: inline-flex; align-items: center; justify-content: center; }

.start-banner {
  display: flex; align-items: center; gap: 10px; justify-content: center;
  margin: 0; padding: 9px 16px; width: 100%;
  border: 0; border-bottom: 1px solid var(--edge); background: var(--panel); cursor: pointer;
}
.start-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.3; } }

/* ---- panels ---------------------------------------------------------- */
.main { flex: 1; padding: 18px 20px 22px; }
.panels { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
.panel {
  flex: 1 1 auto;
  background: var(--panel); border: 1px solid var(--edge); border-radius: var(--radius);
  padding: 12px 16px 14px; box-shadow: var(--shadow);
}
.panel.is-wide { flex-basis: 100%; }
.panel-title {
  margin: 0 0 10px; font-size: 13px; font-weight: 650; color: var(--ink);
  font-variation-settings: "wdth" 80;
}
.controls { display: flex; flex-wrap: wrap; gap: 14px 16px; align-items: flex-start; }
.env-preview { display: block; width: 100%; height: 44px; margin: -2px 0 10px; }
.env-line { fill: none; stroke: var(--accent); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; }
.env-fill { fill: var(--accent); opacity: 0.1; }

/* ---- controls -------------------------------------------------------- */
.ctl { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 62px; position: relative; }
.ctl-label { font-size: 12px; color: var(--ink-soft); text-align: center; max-width: 9em; line-height: 1.2; }
.ctl-value {
  border: 0; background: none; padding: 1px 4px; border-radius: 4px; cursor: text;
  font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap;
}
.ctl-value:hover { background: var(--field); }
.ctl-value.is-static { cursor: default; }
.ctl-value.is-static:hover { background: none; }
.ctl-edit { width: 6.5em; font-size: 12px; text-align: center; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 4px; background: var(--field); }
.ctl.has-cc::after {
  content: ""; position: absolute; top: 0; right: 6px; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft);
}
.ctl.is-learning .knob-dial, .ctl.is-learning .slider-track, .ctl.is-learning .seg, .ctl.is-learning .toggle, .ctl.is-learning select {
  outline: 2px dashed var(--accent); outline-offset: 3px; border-radius: 50%;
}

.knob-dial { width: 52px; height: 52px; cursor: ns-resize; touch-action: none; border-radius: 50%; }
.is-large .knob-dial { width: 70px; height: 70px; }
.is-small .knob-dial { width: 40px; height: 40px; }
.knob-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.knob-track { fill: none; stroke: var(--track); stroke-width: 7; stroke-linecap: round; }
.knob-arc { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; }
.knob-cap { fill: var(--cap); stroke: var(--cap-hi); stroke-width: 2; }
.knob-pointer { stroke: #fff; stroke-width: 4.5; stroke-linecap: round; }
.is-active .knob-cap { stroke: var(--accent); }

.ctl-slider { align-items: stretch; min-width: 150px; }
.ctl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.slider-track { position: relative; height: 22px; cursor: ew-resize; touch-action: none; }
.slider-track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--track); }
.slider-fill { position: absolute; left: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--accent); }
.slider-thumb { position: absolute; top: 3px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: var(--cap); border: 2px solid var(--cap-hi); }

.seg { display: inline-flex; border: 1px solid var(--edge); border-radius: 7px; overflow: hidden; background: var(--field); margin-top: 2px; }
.seg-btn { border: 0; background: none; padding: 5px 9px; cursor: pointer; font-size: 12px; }
.seg-btn + .seg-btn { border-left: 1px solid var(--edge); }
.seg-btn[aria-checked="true"] { background: var(--accent); color: #fff; }
:root[data-theme="dark"] .seg-btn[aria-checked="true"] { color: #0f1316; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg-btn[aria-checked="true"] { color: #0f1316; } }
.ctl-segmented { align-items: flex-start; }
.ctl-segmented .ctl-label { text-align: left; }

.ctl-menu { align-items: flex-start; }
.menu-select { margin-top: 2px; font-size: 12px; }

.toggle { width: 38px; height: 22px; border-radius: 11px; border: 1px solid var(--edge); background: var(--track); position: relative; cursor: pointer; padding: 0; }
.toggle-knob { position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--cap); transition: left 0.12s; }
.toggle[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.toggle[aria-checked="true"] .toggle-knob { left: 18px; background: #fff; }

.xy-pad { position: relative; width: 132px; height: 132px; border-radius: 8px; background: var(--field); border: 1px solid var(--edge); cursor: crosshair; touch-action: none;
  background-image: linear-gradient(var(--edge) 1px, transparent 1px), linear-gradient(90deg, var(--edge) 1px, transparent 1px);
  background-size: 33.33% 33.33%; background-position: -1px -1px; }
.xy-dot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent); border: 2px solid #fff; }
.ctl-custom.is-broken { color: var(--error); max-width: 16em; }

/* ---- keyboard -------------------------------------------------------- */
.keyboard {
  display: flex; gap: 14px; padding: 12px 20px 18px; border-top: 1px solid var(--edge);
  background: var(--panel); position: sticky; bottom: 0;
}
.kb-wheels { display: flex; gap: 10px; padding-top: 28px; }
.wheel-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wheel { position: relative; width: 26px; height: 112px; border-radius: 7px; background: var(--cap); cursor: ns-resize; touch-action: none; }
.wheel.is-bend::after { content: ""; position: absolute; left: 4px; right: 4px; top: 50%; height: 1px; background: var(--cap-hi); }
.wheel-thumb { position: absolute; left: 3px; right: 3px; height: 14px; border-radius: 4px; background: var(--cap-hi); border-top: 2px solid var(--accent); }
.wheel-label { font-size: 11px; color: var(--ink-soft); }
.kb-main { flex: 1; min-width: 0; }
.kb-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; margin-bottom: 8px; }
.kb-octave { display: flex; align-items: center; gap: 6px; }
.kb-spacer { flex: 1; }
.kb-range { font-variant-numeric: tabular-nums; min-width: 5.5em; text-align: center; font-weight: 600; }
.kb-hint { color: var(--ink-soft); font-size: 12px; flex: 1; }
.kb-vel { color: var(--ink-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
.keys { --black-w: min(2.2%, 20px); position: relative; height: 112px; touch-action: none; user-select: none; }
.key { position: absolute; top: 0; cursor: pointer; }
.key-white {
  height: 100%; background: var(--key); border: 1px solid var(--key-edge); border-top: 0;
  border-radius: 0 0 6px 6px; box-shadow: 0 -3px 0 rgba(0, 0, 0, 0.06) inset;
}
.key-black {
  width: var(--black-w); min-width: 12px; height: 62%; background: var(--key-black); z-index: 1;
  border-radius: 0 0 4px 4px; box-shadow: 0 -4px 0 rgba(255, 255, 255, 0.08) inset;
}
.key-white.is-down { background: color-mix(in srgb, var(--accent) 30%, var(--key)); }
.key-black.is-down { background: var(--accent); }
.key-name { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font-size: 10px; color: #6b736f; pointer-events: none; }

/* ---- menus, toasts, errors ------------------------------------------- */
.menu {
  position: fixed; z-index: 20; min-width: 190px; padding: 5px; border-radius: 9px;
  background: var(--panel); border: 1px solid var(--edge); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
}
.menu-item { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; }
.menu-item:hover:not(:disabled), .menu-item:focus-visible { background: var(--field); outline: none; }
.menu-item:disabled { color: var(--ink-soft); opacity: 0.6; cursor: default; }
.menu-sep { height: 1px; background: var(--edge); margin: 4px 6px; }
.toasts { position: fixed; right: 16px; bottom: 16px; z-index: 30; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--cap); color: #fff; padding: 9px 13px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2); }
.toast.is-warn { border-left: 4px solid var(--warn); }
.toast.is-error { border-left: 4px solid var(--error); }
.fatal { max-width: 34rem; margin: 15vh auto; padding: 0 20px; }
.fatal h1 { font-size: 24px; font-variation-settings: "wdth" 75; }

/* ---- small screens --------------------------------------------------- */
@media (max-width: 720px) {
  .top { padding: 12px 16px; gap: 10px 14px; }
  .presets { width: 100%; }
  .preset-field { flex: 1; }
  .preset-select, .preset-name { width: 100%; }
  .output { margin-left: 0; }
  .scope { width: 120px; }
  .main { padding: 14px 16px; }
  .panel { flex: 1 1 100%; }
  .keyboard { padding: 10px 16px 14px; gap: 10px; }
  .kb-hint { display: none; }
  .kb-spacer { display: none; }
  .wheel { height: 96px; width: 22px; }
  .keys { height: 96px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* ---- modulation ------------------------------------------------------ */
.knob-mod { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; opacity: 0.55; }
.btn-small { padding: 3px 9px; font-size: 12px; }
.btn[aria-pressed="true"].btn-small { border-color: var(--accent); color: var(--accent); }
.seg-small .seg-btn { padding: 3px 9px; }
.menu { max-height: min(70vh, 520px); overflow-y: auto; }

.lfo-panel { flex: 1 1 280px; }
.lfo-preview { display: block; width: 100%; height: 36px; margin: -2px 0 10px; overflow: visible; }
.lfo-axis { stroke: var(--edge); stroke-width: 1; vector-effect: non-scaling-stroke; }
.lfo-line { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; }
.lfo-dot { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; vector-effect: non-scaling-stroke; }

.shape-body { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
.shape-editor { flex: 1 1 420px; min-width: 0; }
.shape-panel .controls { flex: 1 1 300px; }
.shape-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
.shape-hint { color: var(--ink-soft); font-size: 12px; }
.shape-area { border: 1px solid var(--edge); border-radius: 8px; background: var(--field); touch-action: none; overflow: hidden; }
.shape-svg { display: block; width: 100%; height: auto; cursor: crosshair; }
.grid-bar { stroke: var(--ink-soft); stroke-width: 1; opacity: 0.55; }
.grid-beat { stroke: var(--edge); stroke-width: 1; }
.grid-sub { stroke: var(--edge); stroke-width: 1; opacity: 0.5; stroke-dasharray: 2 3; }
.shape-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }
.shape-fill { fill: var(--accent); opacity: 0.1; }
.shape-point { fill: var(--panel); stroke: var(--accent); stroke-width: 2; cursor: grab; }
.shape-point.is-step { fill: var(--accent); }
.shape-point.is-sel { stroke: var(--ink); stroke-width: 2.5; }
.handle-arm { stroke: var(--ink-soft); stroke-width: 1.2; }
.handle-knob { fill: var(--ink); stroke: var(--panel); stroke-width: 1.5; cursor: move; }
.handle-knob.is-pinned { fill: var(--panel); stroke: var(--ink); stroke-dasharray: 2 2; }
.shape-release line { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.release-grip { fill: var(--ink); cursor: ew-resize; }
.shape-head { stroke: var(--ink); stroke-width: 1.5; opacity: 0.7; }

.matrix { display: flex; flex-direction: column; gap: 8px; }
.matrix-empty { margin: 0; color: var(--ink-soft); }
.route { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 6px 0; border-bottom: 1px solid var(--edge); }
.route:last-child { border-bottom: 0; }
.route select { max-width: 13rem; }
.route-src { display: flex; flex-direction: column; gap: 3px; }
.route-to { color: var(--ink-soft); }
.route-via { display: flex; align-items: center; gap: 6px; color: var(--ink-soft); font-size: 12px; }
.route-meter { position: relative; height: 3px; border-radius: 2px; background: var(--track); overflow: hidden; }
.route-meter-fill { position: absolute; top: 0; bottom: 0; background: var(--accent); }
.amt { display: flex; align-items: center; gap: 6px; }
.amt-track { position: relative; width: 140px; height: 22px; cursor: ew-resize; touch-action: none; }
.amt-track::before { content: ""; position: absolute; left: 0; right: 0; top: 9px; height: 4px; border-radius: 2px; background: var(--track); }
.amt-zero { position: absolute; left: 50%; top: 5px; width: 1px; height: 12px; background: var(--ink-soft); }
.amt-fill { position: absolute; top: 9px; height: 4px; background: var(--accent); border-radius: 2px; }
.amt-value { min-width: 4.2em; text-align: right; }
.matrix-foot { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.matrix-count { color: var(--ink-soft); font-size: 12px; }

@media (max-width: 720px) {
  .route select { max-width: 100%; }
  .amt-track { width: 110px; }
  .shape-hint { display: none; }
}

/* Dragging controls must never start a text selection. */
.shape-area, .amt, .knob-dial, .slider-track, .wheel, .xy-pad, .keys, .seg { -webkit-user-select: none; user-select: none; }

</style>
</head>

<script type="text/plain" id="sk-worklet">// Shared by the page and the AudioWorklet: a minimal WASI shim and helpers
// for passing strings to and from the synth's WebAssembly module.
// (TextEncoder/TextDecoder aren't available inside AudioWorklets.)

function skUtf8Encode(str) {
  const out = [];
  for (let i = 0; i < str.length; i++) {
    let c = str.codePointAt(i);
    if (c > 0xffff) i++;
    if (c < 0x80) out.push(c);
    else if (c < 0x800) out.push(0xc0 | (c >> 6), 0x80 | (c & 63));
    else if (c < 0x10000) out.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
    else out.push(0xf0 | (c >> 18), 0x80 | ((c >> 12) & 63), 0x80 | ((c >> 6) & 63), 0x80 | (c & 63));
  }
  return out;
}

function skUtf8Decode(bytes) {
  let s = "";
  for (let i = 0; i < bytes.length; ) {
    const b = bytes[i++];
    let c;
    if (b < 0x80) c = b;
    else if (b < 0xe0) c = ((b & 31) << 6) | (bytes[i++] & 63);
    else if (b < 0xf0) c = ((b & 15) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
    else c = ((b & 7) << 18) | ((bytes[i++] & 63) << 12) | ((bytes[i++] & 63) << 6) | (bytes[i++] & 63);
    s += String.fromCodePoint(c);
  }
  return s;
}

function skBase64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

// Imports for the module. `log` receives text the synth prints (errors).
function skImports(getMemory, log) {
  const ENOSYS = 52, EBADF = 8;
  const view = () => new DataView(getMemory().buffer);
  const bytes = (ptr, len) => new Uint8Array(getMemory().buffer, ptr, len);
  const wasi = {
    fd_write(fd, iovs, iovsLen, nwritten) {
      const dv = view();
      let total = 0, text = "";
      for (let i = 0; i < iovsLen; i++) {
        const p = dv.getUint32(iovs + i * 8, true), n = dv.getUint32(iovs + i * 8 + 4, true);
        text += skUtf8Decode(bytes(p, n));
        total += n;
      }
      dv.setUint32(nwritten, total, true);
      if (text.trim()) log(text.trim());
      return 0;
    },
    proc_exit(code) { throw new Error("synth stopped (exit " + code + ")"); },
    environ_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    environ_get() { return 0; },
    args_sizes_get(c, s) { const dv = view(); dv.setUint32(c, 0, true); dv.setUint32(s, 0, true); return 0; },
    args_get() { return 0; },
    clock_time_get(id, precision, out) { view().setBigUint64(out, BigInt(Date.now()) * 1000000n, true); return 0; },
    random_get(buf, len) { const b = bytes(buf, len); for (let i = 0; i < len; i++) b[i] = (Math.random() * 256) | 0; return 0; },
    fd_prestat_get() { return EBADF; },
    fd_close() { return EBADF; },
    fd_fdstat_get() { return EBADF; },
    fd_seek() { return EBADF; },
    fd_read() { return EBADF; },
  };
  return {
    wasi_snapshot_preview1: new Proxy(wasi, { get: (t, k) => t[k] || (() => ENOSYS) }),
    env: {
      sk_log(ptr, len) { log(skUtf8Decode(bytes(ptr, len))); },
    },
  };
}

// Thin wrapper over an instantiated synth module.
class SkWasm {
  constructor(instance) {
    this.x = instance.exports;
    if (this.x._initialize) this.x._initialize();
    this.x.sk_init();
  }
  get memory() { return this.x.memory; }
  // Read a NUL-terminated UTF-8 string.
  str(ptr) {
    const m = new Uint8Array(this.x.memory.buffer);
    let end = ptr;
    while (m[end] !== 0) end++;
    return skUtf8Decode(m.subarray(ptr, end));
  }
  // Call fn with pointers to NUL-terminated copies of each string argument.
  withStrings(strings, fn) {
    const ptrs = strings.map((s) => {
      const enc = skUtf8Encode(String(s));
      const p = this.x.sk_alloc(enc.length + 1);
      const m = new Uint8Array(this.x.memory.buffer);
      m.set(enc, p);
      m[p + enc.length] = 0;
      return p;
    });
    try { return fn(...ptrs); } finally { ptrs.forEach((p) => this.x.sk_free(p)); }
  }
  json(ptr) { return JSON.parse(this.str(ptr)); }
}

// AudioWorklet processor: runs the synth. Receives MIDI, parameter changes and
// patches from the page; sends back meters and a scope trace.
const SCOPE = 1024;

class SynthkitProcessor extends AudioWorkletProcessor {
  constructor(options) {
    super();
    const o = options.processorOptions || {};
    this.log = (m) => this.port.postMessage({ t: "log", msg: m });
    let memory = null;
    const mod = new WebAssembly.Module(o.wasm);
    const inst = new WebAssembly.Instance(mod, skImports(() => memory, this.log));
    memory = inst.exports.memory;
    this.w = new SkWasm(inst);
    this.x = this.w.x;
    // Load the sound before prepare, so parameters start at their values
    // instead of gliding there from the defaults.
    // (The patch includes the mod matrix and shapes.)
    if (o.patch) this.w.withStrings([o.patch], (p) => this.x.sk_load_patch(p));
    for (const [id, json] of Object.entries(o.custom || {})) this.w.withStrings([id, json], (a, b) => this.x.sk_set_custom(a, b));
    this.block = 128;
    this.x.sk_prepare(sampleRate, this.block);
    this.meterCount = this.x.sk_mod_meter_count();
    this.clockCorr = 0;  // beats still to absorb when following MIDI clock

    const tr = o.transport || {};
    this.bpm = tr.bpm || 120;
    this.playing = !!tr.playing;
    this.num = tr.num || 4;
    this.den = tr.den || 4;
    this.beat = 0;

    this.queue = [];                   // live MIDI: [status, d1, d2]
    this.schedule = o.schedule || [];  // offline renders: {sample, d}
    this.si = 0;
    this.pos = 0;
    this.scope = new Float32Array(SCOPE);
    this.scopePos = 0;
    this.peak = 0;
    this.meterEvery = Math.round(sampleRate / 30);
    this.sinceMeter = 0;
    this.meters = o.meters !== false;
    this.port.onmessage = (e) => this.onMessage(e.data);
  }

  onMessage(m) {
    const x = this.x;
    switch (m.t) {
      case "midi": this.queue.push(m.d); break;
      case "param": x.sk_set_param(m.i, m.v); break;
      case "patch": this.w.withStrings([m.json], (p) => x.sk_load_patch(p)); break;
      case "custom": this.w.withStrings([m.id, m.json], (a, b) => x.sk_set_custom(a, b)); break;
      case "mod": this.w.withStrings([m.json], (p) => x.sk_set_mod(p)); break;
      case "shapes": this.w.withStrings([m.json], (p) => x.sk_set_shapes(p)); break;
      case "clock": {
        // Follow external MIDI clock: big differences are jumps, small ones
        // are absorbed gradually so the engine never sees a false jump.
        this.bpm = m.bpm;
        if (m.playing && !this.playing) { this.beat = m.beat; this.clockCorr = 0; }
        this.playing = m.playing;
        const err = m.beat - this.beat;
        if (Math.abs(err) > 0.5) { this.beat = m.beat; this.clockCorr = 0; } else this.clockCorr = err;
        break;
      }
      case "transport":
        if (m.playing && !this.playing) this.beat = 0;  // start from the top
        this.bpm = m.bpm; this.playing = m.playing; this.num = m.num; this.den = m.den;
        break;
      case "allOff": x.sk_all_notes_off(); break;
      case "panic": x.sk_panic(); break;
    }
  }

  process(inputs, outputs) {
    const out = outputs[0];
    const L = out[0], R = out[1] || out[0];
    const n = L.length;
    const x = this.x;
    for (const d of this.queue) x.sk_midi(0, d[0], d[1] | 0, d[2] | 0);
    this.queue.length = 0;
    while (this.si < this.schedule.length && this.schedule[this.si].sample < this.pos + n) {
      const ev = this.schedule[this.si++];
      x.sk_midi(Math.max(0, ev.sample - this.pos), ev.d[0], ev.d[1] | 0, ev.d[2] | 0);
    }
    x.sk_process(n, this.bpm, this.playing ? 1 : 0, this.beat, this.num, this.den);
    if (this.playing) {
      this.beat += (n / sampleRate) * (this.bpm / 60);
      if (this.clockCorr !== 0) {
        const step = this.clockCorr * Math.min(1, n / (sampleRate * 0.2));
        this.beat += step;
        this.clockCorr -= step;
        if (Math.abs(this.clockCorr) < 1e-6) this.clockCorr = 0;
      }
    }
    this.pos += n;
    // Views must be re-created if the module's memory grew.
    const buf = this.x.memory.buffer;
    const l = new Float32Array(buf, x.sk_left(), n), r = new Float32Array(buf, x.sk_right(), n);
    L.set(l);
    if (R !== L) R.set(r);

    if (!this.meters) return true;
    for (let i = 0; i < n; i++) {
      const v = 0.5 * (l[i] + r[i]);
      this.scope[this.scopePos] = v;
      this.scopePos = (this.scopePos + 1) % SCOPE;
      const a = Math.max(Math.abs(l[i]), Math.abs(r[i]));
      if (a > this.peak) this.peak = a;
    }
    this.sinceMeter += n;
    if (this.sinceMeter >= this.meterEvery) {
      this.sinceMeter = 0;
      const st = new Float32Array(this.x.memory.buffer, x.sk_stats(), 5);
      const trace = new Float32Array(SCOPE);
      for (let i = 0; i < SCOPE; i++) trace[i] = this.scope[(this.scopePos + i) % SCOPE];
      const mod = new Float32Array(this.meterCount);
      if (this.meterCount) mod.set(new Float32Array(this.x.memory.buffer, x.sk_mod_meters(), this.meterCount));
      this.port.postMessage({ t: "meter", voices: st[0], limiterDb: st[1], peak: this.peak, beat: this.beat, playing: this.playing, bpm: this.bpm, scope: trace, mod }, [trace.buffer, mod.buffer]);
      this.peak = 0;
    }
    return true;
  }
}

registerProcessor("synthkit", SynthkitProcessor);
